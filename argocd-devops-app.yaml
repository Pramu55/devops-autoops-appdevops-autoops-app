apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-autoops-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Pramu55/devops-autoops-appdevops-autoops-app.git
    targetRevision: main
    path: helm/devops-chart
    helm:
      releaseName: devops-release
      parameters:
        - name: image.repository
          value: pramu55/devops-app
        - name: image.tag
          value: "11"
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy: {}
