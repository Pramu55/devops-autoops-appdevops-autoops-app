replicaCount: 2

image:
  repository: pramu55/devops-app
  tag: v1
  pullPolicy: Always

service:
  type: NodePort
  port: 3000
  targetPort: http

containerPort: 3000

config:
  serviceName: devops-autoops-platform
  nodeEnv: production

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: /metrics
  prometheus.io/port: "3000"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  readinessPath: /ready
  livenessPath: /health
  readinessInitialDelaySeconds: 5
  readinessPeriodSeconds: 10
  livenessInitialDelaySeconds: 15
  livenessPeriodSeconds: 20

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: false

serviceMonitor:
  enabled: true
  path: /metrics
  interval: 15s
