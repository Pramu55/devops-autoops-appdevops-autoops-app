apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-devops-chart
  labels:
    app: devops-app
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: devops-app
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: devops-app
        release: {{ .Release.Name }}
    spec:
      containers:
        - name: devops-app
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: 3000
            initialDelaySeconds: {{ .Values.probes.readinessInitialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readinessPeriodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: 3000
            initialDelaySeconds: {{ .Values.probes.livenessInitialDelaySeconds }}
            periodSeconds: {{ .Values.probes.livenessPeriodSeconds }}
