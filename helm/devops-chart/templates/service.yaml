apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-devops-chart
  labels:
    app: devops-app
    release: {{ .Release.Name }}
spec:
  type: NodePort
  selector:
    app: devops-app
    release: {{ .Release.Name }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: 3000
