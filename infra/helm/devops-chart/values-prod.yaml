replicaCount: 3

image:
  pullPolicy: Always

resources:
  requests:
    cpu: 150m
    memory: 128Mi
  limits:
    cpu: 750m
    memory: 384Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 65

pdb:
  enabled: true
  minAvailable: 2

networkPolicy:
  enabled: true
