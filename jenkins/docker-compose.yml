services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops-autoops-jenkins
    restart: unless-stopped
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ${KUBE_CONFIG_DIR}:/var/jenkins_home/.kube:ro
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false

volumes:
  jenkins_home:
